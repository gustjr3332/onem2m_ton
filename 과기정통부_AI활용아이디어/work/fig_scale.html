<!doctype html>
<html lang="ko"><head><meta charset="utf-8">

<body><div class="wrap">

  <g transform="translate(95,110)">
    <rect x="0" y="0" width="190" height="150" fill="none" stroke="#1F4E79" stroke-width="4"/>

  <text x="800" y="405" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">AI 제어 서버 + 표준 IoT 플랫폼 (하나로 공통)</text>
  <text x="800" y="445" text-anchor="middle" font-size="23" fill="#DCE6F2">칸마다 조도·각도 기록 → AI가 칸별 각도 예측 → 구역 단위로 한 번에 명령</text>
  <path d="M190 290 L190 415 L325 415" fill="none" stroke="#1F4E79" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M610 290 L610 355" stroke="#1F4E79" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M1110 290 L1110 355" stroke="#1F4E79" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="800" y="525" text-anchor="middle" font-size="24" fill="#333">칸 수가 늘어도 서버와 앱은 그대로 — 가상 1,000칸 등록·기록 부하 실험에서 실패 0건</text>
